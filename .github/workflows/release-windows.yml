name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag to publish to (e.g. v0.1.0). Leave empty for artifact-only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: karsa-release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64 (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build embedded web bundle (dist-web/)
        run: bun run build:web

      - name: Fetch and verify Figcraft canvas bundle
        run: node scripts/canvas/fetch-figcraft-bundle.mjs

      - name: Build Karsa Windows installer
        run: bun run build:tauri:win

      - name: Collect installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Copy-Item -Destination release-artifacts/
          Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination release-artifacts/
          Get-ChildItem release-artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: karsa-windows-x64
          path: release-artifacts/*
          if-no-files-found: error

      - name: Determine release tag
        id: tag
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}" -ne "") {
            $tag = "${{ inputs.release_tag }}"
          }
          "value=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub Release
        if: steps.tag.outputs.value != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Karsa ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: release-artifacts/*
