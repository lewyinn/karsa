name: Karsa CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: karsa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    name: Typecheck, Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (web & node)
        run: |
          bun run typecheck:web
          bun run typecheck:node

      - name: Run Karsa unit tests
        run: >-
          bun run test
          src/renderer/lib/model-pricing.test.ts
          src/renderer/stores/usage-history-store.test.ts
          src/renderer/components/usage/UsageDashboardPanel.test.tsx
          src/renderer/components/github/CreateIssueDialog.test.tsx
          src/renderer/components/github/CreatePrDialog.test.tsx
          src/renderer/components/github/StartIssueBranchDialog.test.tsx
          src/renderer/components/github/GithubIssueDevelopment.test.tsx
          src/renderer/components/chat/ChangedFilesCard.test.tsx
          src/renderer/components/stack/RunStackPanel.test.tsx
          src/renderer/components/env/EnvManagerPanel.test.tsx
          src/renderer/lib/stack-discovery.test.ts
          src/renderer/lib/env-file-manager.test.ts
          src/renderer/components/git/GitPanel.test.tsx
          src/renderer/components/shell/SidePanelColumn.test.tsx
          src/renderer/components/shell/tool-strip/ShellToolStrip.test.tsx
          src/renderer/components/chat/chat-markdown-file-url-spaces.test.ts
          src/renderer/components/chat/chat-agent-prose.file-url-spaces.test.tsx
          src/renderer/components/chat/user-message-markdown.test.ts
          src/renderer/lib/antigravity-account-name.test.ts
          src/renderer/lib/__tests__/git-api.web.test.ts
          src/renderer/stores/git-status-store.test.ts
          src/renderer/lib/bug-report-api.test.ts
          src/renderer/components/bug-report/ReportBugDialog.test.tsx
          src/renderer/components/settings/provider/AntigravityProviderSettings.test.tsx
          src/renderer/lib/chat-reference.test.ts
          src/renderer/components/chat/conversation-context.test.ts
          src/renderer/lib/confirm-install-update.test.ts
          src/renderer/lib/factory-key-api.test.ts
          src/renderer/lib/mcp-catalog-copy.test.ts
          src/renderer/lib/manifest-check.test.ts

      - name: Build Tauri frontend bundle
        run: bun run build:frontend:tauri
